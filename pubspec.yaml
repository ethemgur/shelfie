name: shelfie
description: "Social reading tracker. Log your page, share a card, get kudos."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  cached_network_image: ^4.0.2
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  flutter_timezone: ^5.1.0
  freezed_annotation: ^3.1.0
  go_router: ^18.0.1
  http: ^1.6.0
  image_picker: ^1.2.3
  intl: ^0.20.3
  json_annotation: ^4.12.0
  mobile_scanner: ^7.4.2
  path_provider: ^2.1.6
  riverpod_annotation: ^4.0.7
  share_plus: ^13.3.0
  uuid: ^4.6.0
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  firebase_storage: ^13.6.0
  cloud_functions: ^6.5.0
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.16.1
  flutter_lints: ^6.0.0
  freezed: ^4.0.2
  json_serializable: ^6.14.1
  riverpod_generator: ^4.0.9

flutter:
  uses-material-design: true
  generate: true

  # Fonts are bundled (never downloaded at runtime) so share images render
  # identically offline and on every device. See assets/fonts/OFL-*.txt.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-SemiBold.ttf
          weight: 600
