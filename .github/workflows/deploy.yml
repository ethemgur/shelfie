name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy-backend:
    name: Deploy Firestore/Storage rules + Cloud Functions
    runs-on: ubuntu-latest
    steps:
      - name: Check backend deploy is enabled
        id: enabled
        run: |
          if [ "${{ vars.DEPLOY_FIREBASE_BACKEND }}" = "true" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Firebase backend deploy skipped. Upgrade the project to the Blaze plan, grant the deploy service account its roles, then set the DEPLOY_FIREBASE_BACKEND repository variable to true (see README)."
          fi
      - uses: actions/checkout@v4
        if: steps.enabled.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.enabled.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Install functions dependencies
        if: steps.enabled.outputs.ok == 'true'
        run: npm ci --prefix functions
      - name: Deploy
        if: steps.enabled.outputs.ok == 'true'
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          PROJECT_ID=$(jq -r .project_id "$RUNNER_TEMP/sa.json")
          npx --prefix functions firebase deploy \
            --only firestore,storage,functions \
            --project "$PROJECT_ID" --non-interactive --force

  deploy-web:
    name: Deploy web to Firebase Hosting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # No Firebase config is compiled in; see ci.yml.
      - run: >-
          flutter build web --release
          --dart-define=FLAVOR=dev
          --dart-define=GOOGLE_BOOKS_API_KEY=${{ vars.GOOGLE_BOOKS_API_KEY }}

      # The project ID is read from the service account key so only one secret is needed.
      - name: Read Firebase project ID
        id: project
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: echo "id=$(echo "$SERVICE_ACCOUNT" | jq -r .project_id)" >> "$GITHUB_OUTPUT"

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ steps.project.outputs.id }}
          channelId: live
